<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books App</title>
</head>

<body>
  <main>
    <h1>My Books List</h1>

    <div id="auth-panel">
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log in</button>
      </form>
      <p id="auth-error" class="auth-error hidden" role="alert"></p>

      <div id="auth-info">
        <span id="auth-status">Not logged in</span>
        <button id="logout-btn" class="hidden">Log out</button>
      </div>
    </div>

    <p id="auth-gate-message" class="auth-gate hidden">Log in to add and manage books in your library.</p>

    <section id="book-section">
      <form id="book-form" method="POST">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
        <label for="format">Format:</label>
        <select name="format" id="format" required>
          <option value="null">Please select</option>
          <option value="hardback">Hardback</option>
          <option value="paperback">Paperback</option>
          <option value="ebook">eBook</option>
        </select>
        <label for="genre">Genre:</label>
        <select name="genre" id="genre">
          <option value="autobiography">Autobiography</option>
          <option value="biography">Biography</option>
          <option value="fantasy">Fantasy</option>
          <option value="fiction">Fiction</option>
          <option value="history">History</option>
          <option value="mystery">Mystery</option>
          <option value="mythology">Mythology</option>
          <option value="nature">Nature/Natural History</option>
          <option value="non-fiction">Non-fiction</option>
          <option value="sci-fi">Science Fiction</option>
          <option value="other">Other</option>
        </select>
        <label for="cost">Cost:</label>
        <input type="text" name="cost" id="cost">
        <label for="purchase_date">Date of purchase:</label>
        <input type="date" name="purchase_date" id="purchase_date">
        <label for="publisher">Publisher:</label>
        <input type="text" name="publisher" id="publisher">
        <label for="year_published">Year Published:</label>
        <input type="number" name="year_published" id="year_published">
        <label for="isbn">ISBN:</label>
        <input type="text" name="isbn" id="isbn">
        <label for="read">Read:</label>
        <input type="checkbox" name="read" id="read">
        <label for="rating">Rating:</label>
        <select name="rating" id="rating">
          <option value="null">Please select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <label for="notes">Notes:</label>
        <textarea name="notes" id="notes"></textarea>
        <button type="submit">Add Book</button>
      </form>
    </section>

    <div id="library-header">
      <h2>My Books Library</h2>
      <p id="library-summary"></p>
    </div>

    <div id="app-message" class="app-message hidden" role="status"></div>

    <div id="books-table-wrapper" class="table-wrapper">
      <table id="books-table" border="0" cellpadding="0" cellspacing="0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Format</th>
            <th>Genre</th>
            <th class="col-read">Read</th>
            <th class="col-rating">Rating</th>
            <th class="col-publisher">Publisher</th>
            <th>Year</th>
            <th>Date of purchase</th>
            <th class="col-notes">Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="books-cards"></div>

    <div id="modal" class="modal-container hidden">
      <div class="modal-panel">
        <button type="button" id="modal-close" class="modal-close" aria-label="Close edit form">&times;</button>
        <div class="form-container"></div>
      </div>
    </div>

  </main>
  <footer></footer>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
